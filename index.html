<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora TCG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho com logo -->
  <header class="topo">
    <img src="Logo.png" alt="Logo TCG" class="logo">
  </header>

  <!-- Calculadora -->
  <main class="container">
    <h2>Calculadora Produtos 3D</h2>

    <label for="gramas">QUANTIDADE DE MATERIAL (g)</label>
    <input type="number" id="gramas" placeholder="Ex: 150">

    <label for="tempo">TEMPO DE IMPRESSÃO (h)</label>
    <input type="number" id="tempo" placeholder="Ex: 8">

    <label for="filamento">TIPO DE MATERIAL</label>
    <select id="filamento">
      <option value="padrao">Padrão</option>
      <option value="engenharia">Engenharia</option>
    </select>

    <label for="complexidade">COMPLEXIDADE</label>
    <select id="complexidade">
      <option value="padrao">Padrão</option>
      <option value="media">Média</option>
      <option value="alta">Alta</option>
    </select>

    <label for="quantidade">QUANTIDADE DE PEÇAS</label>
    <input type="number" id="quantidade" value="1" min="1">

    <button id="btnCalcular">CALCULAR</button>

    <section class="caixa-resultado">
      <div class="linha">
        <span>VALOR TOTAL:</span>
        <strong id="valorTotal">R$ 0,00</strong>
      </div>

      <div class="linha">
        <span>VALOR UNITÁRIO:</span>
        <strong id="valorUnitario">R$ 0,00</strong>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
